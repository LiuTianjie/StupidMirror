<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StupidMirror</title>
  <style>:root{color-scheme:light dark;--canvas:#f6f6f5;--surface:#fff;--text:#252527;--muted:#77777d;--line:#0000000d;--hover:#00000005;--pressed:#0000000b;--accent:#a3540a;--live:#14783b;--warn:#975c05;--shadow:0 8px 24px #00000012,0 1px 3px #00000008}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--canvas:#202022;--surface:#2a2a2d;--text:#f1f1f2;--muted:#a6a6ad;--line:#ffffff12;--hover:#ffffff08;--pressed:#ffffff12;--accent:#ed9433;--live:#38b36b;--warn:#eb9e33;--shadow:0 8px 24px #0005,0 1px 3px #0003}}
:root[data-theme="dark"]{--canvas:#202022;--surface:#2a2a2d;--text:#f1f1f2;--muted:#a6a6ad;--line:#ffffff12;--hover:#ffffff08;--pressed:#ffffff12;--accent:#ed9433;--live:#38b36b;--warn:#eb9e33;--shadow:0 8px 24px #0005,0 1px 3px #0003}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}button{font:inherit}button,svg{-webkit-tap-highlight-color:transparent}button{touch-action:manipulation}button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}[hidden]{display:none!important}
#app{position:relative;width:100%;height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;background:var(--canvas);color:var(--text);font:400 13px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC",sans-serif;-webkit-font-smoothing:antialiased}
#status{flex:none;display:flex;align-items:center;justify-content:space-between;height:58px;padding:0 20px;border-bottom:1px solid var(--line);background:var(--surface);user-select:none;z-index:10;gap:12px}
#device-switcher{position:relative;min-width:0}#device-picker{appearance:none;display:flex;align-items:center;gap:9px;max-width:100%;height:34px;border:0;border-radius:8px;padding:0 8px;margin-left:-8px;background:transparent;color:var(--text);cursor:pointer;transition:background .12s}#device-picker:hover,#device-picker[aria-expanded="true"]{background:var(--hover)}#device-picker:disabled{cursor:default}#model{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.phone-icon{width:18px;height:20px;stroke:var(--muted);fill:none;stroke-width:1.5;stroke-linecap:round}.chevron{width:14px;height:14px;fill:none;stroke:var(--muted);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;margin-left:5px}
#live{display:flex;align-items:center;gap:6px;flex:none;color:var(--muted);font-size:11px;font-weight:500;white-space:nowrap}.dot{width:5px;height:5px;border-radius:50%;background:currentColor}#app[data-live="live"] #live{color:var(--live)}#app[data-live="paused"] #live{color:var(--warn)}
#device-menu{position:absolute;top:43px;left:-6px;width:250px;max-width:calc(100vw - 28px);padding:5px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:auto;max-height:300px}#device-menu:empty::before{content:"未发现设备";display:block;padding:18px;color:var(--muted);text-align:center}#device-menu button{display:flex;align-items:center;width:100%;gap:11px;padding:10px;border:0;border-radius:8px;background:transparent;color:var(--text);text-align:left;cursor:pointer}#device-menu button:hover,#device-menu button:focus-visible{background:var(--hover);outline:0}#device-menu button[aria-selected="true"]{background:var(--pressed)}.device-option-icon{width:15px;height:23px;border:1.5px solid var(--muted);border-radius:4px;flex:none;position:relative}.device-option-icon::after{content:"";position:absolute;left:4px;right:4px;bottom:2px;border-bottom:1px solid var(--muted)}.device-option-copy{display:flex;flex:1;min-width:0;flex-direction:column;gap:2px}.device-option-name{font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.device-option-detail{font-size:10px;color:var(--muted)}.device-option-check{width:12px;height:7px;border:solid var(--accent);border-width:0 0 1.7px 1.7px;transform:rotate(-45deg);margin-right:3px;opacity:0}#device-menu button[aria-selected="true"] .device-option-check{opacity:1}
#stage{position:relative;flex:1 1 auto;min-height:0;min-width:0;display:flex;align-items:center;justify-content:center;margin:20px 20px 0;isolation:isolate}#device{position:relative;flex:none;background:#000;border-radius:var(--screen-radius);box-shadow:0 10px 24px -8px #00000029,0 0 0 .75px #0000004d;user-select:none;pointer-events:none}#screen{position:absolute;inset:0;overflow:hidden;border-radius:inherit;line-height:0;background:#000}#image{display:block;width:100%;height:100%;object-fit:contain;user-select:none;pointer-events:none}
#empty-state{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted)}.empty-state-content{display:flex;align-items:center;flex-direction:column;gap:10px;max-width:290px;text-align:center;padding:24px}.empty-symbol{display:grid;place-items:center;width:58px;height:58px;margin-bottom:5px;border:1px solid var(--line);border-radius:16px;background:var(--surface);color:var(--muted)}.empty-symbol svg{width:28px;height:32px;fill:none;stroke:currentColor;stroke-width:1.2;stroke-linecap:round}#empty-state-text{font-size:13px;font-weight:500;line-height:1.6;color:var(--text);overflow-wrap:anywhere}.empty-hint{font-size:11px;color:var(--muted)}#empty-state[data-state="paused"] .empty-hint{visibility:hidden}
#toolbar{align-self:center;flex:none;display:flex;align-items:center;gap:4px;margin:18px 16px 20px;padding:4px;border:1px solid var(--line);border-radius:12px;background:var(--surface);user-select:none}#toolbar button{appearance:none;display:flex;align-items:center;justify-content:center;gap:6px;min-width:58px;height:32px;padding:0 10px;border:0;border-radius:8px;background:transparent;color:var(--text);cursor:pointer;font-size:11px;transition:background .12s,color .12s}#toolbar button:hover{background:var(--hover);color:var(--accent)}#toolbar button:active{background:var(--pressed)}#toolbar button:disabled{opacity:.3;cursor:default;background:transparent;color:var(--text)}#toolbar svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round;flex:none}#toolbar button[data-busy="true"] svg{opacity:.45}#toolbar .play-symbol{display:none}#toolbar button[data-paused="true"] .play-symbol{display:block}#toolbar button[data-paused="true"] .pause-symbol{display:none}
#toast{position:absolute;left:50%;bottom:82px;max-width:calc(100% - 40px);z-index:8;padding:9px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--text);box-shadow:var(--shadow);transform:translateX(-50%);font-size:12px;text-align:center;pointer-events:none}#toast[data-tone="error"]{color:#b3292b}
.gesture-cursor{position:absolute;z-index:4;width:26px;height:26px;margin:-13px 0 0 -13px;border:1.5px solid #ffffffe6;border-radius:50%;background:#80808066;box-shadow:0 0 0 1px #4c4c4c66,0 2px 6px #00000026;pointer-events:none}
@media(max-width:380px){#status{height:52px;padding:0 16px}#stage{margin:16px 12px 0}#toolbar{margin:14px 12px 16px;gap:0}#toolbar button{min-width:54px;padding:0 7px}#device-menu{width:230px}}
@media(max-height:420px){#status{height:44px}#stage{margin:10px 12px 0}#toolbar{margin:10px 12px}#toolbar button{height:28px}.empty-symbol{display:none}}
@media(prefers-reduced-motion:reduce){button{transition:none!important}}
#device-switcher{flex:1;max-width:calc(100% - 70px)}#device-picker{width:max-content;max-width:100%;min-width:145px}#model{max-width:220px}.phone-icon,.chevron{flex:none}
#device{pointer-events:auto}#screen{touch-action:none}#video{display:block;width:100%;height:100%;object-fit:contain;pointer-events:none}#app[data-control="true"] #screen,#app[data-annotation="true"] #screen{cursor:crosshair}#annotation-overlay{position:absolute;inset:0;width:100%;height:100%;z-index:6;pointer-events:none;overflow:hidden}.annotation-region{fill:#e7832212;stroke:#db701d;stroke-width:2;vector-effect:non-scaling-stroke}.annotation-number-bg{fill:#db701d}.annotation-number{fill:white;font-family:-apple-system,sans-serif;font-weight:600;text-anchor:middle;dominant-baseline:middle}
#toolbar button[aria-pressed="true"]{background:var(--pressed);color:var(--accent)}.toolbar-divider{height:18px;border-left:1px solid var(--line);margin:0 3px}
#annotation-editor{flex:none;width:calc(100% - 40px);max-width:620px;align-self:center;margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}.annotation-heading{display:flex;align-items:center;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:8px}#annotation-note{display:block;resize:vertical;min-height:52px;max-height:120px;width:100%;border:0;background:transparent;color:var(--text);font:12px/1.5 -apple-system,BlinkMacSystemFont,sans-serif;outline:none}#annotation-note::placeholder{color:var(--muted)}.annotation-footer{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px}.annotation-footer>span{flex:1 1 100%;color:var(--muted);font-size:10px}#annotation-editor button{border:0;padding:6px 9px;border-radius:7px;background:var(--hover);color:var(--text);font-size:11px;cursor:pointer}#annotation-editor button:disabled{opacity:.35;cursor:default}#annotation-editor #annotation-send{margin-left:auto;color:var(--surface);background:var(--accent)}#annotation-editor #annotation-undo{padding:3px 6px;background:transparent;color:var(--muted)}#app[data-annotation="true"] #toolbar{margin-top:10px}
@media(max-width:520px){#toolbar button{min-width:34px;padding:0 8px}#toolbar button span{display:none}#toolbar{gap:3px}}
@media(min-width:960px){#annotation-editor{position:absolute;right:20px;bottom:82px;width:280px;max-width:280px;margin:0;z-index:8;box-shadow:var(--shadow)}#app[data-annotation="true"] #toolbar{margin-top:18px}}
</style>
</head>
<body>
  <main id="app" data-frame-seq="0" data-busy="false" data-operating="false" data-live="connecting" aria-label="手机实时屏幕">
    <header id="status">
      <div id="device-switcher">
        <button id="device-picker" type="button" aria-label="选择手机" aria-haspopup="listbox" aria-expanded="false" aria-controls="device-menu">
          <svg class="phone-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="6.5" y="2.5" width="11" height="19" rx="3"/><path d="M10 5h4M10.5 18.5h3"/></svg>
          <span id="model">选择设备</span>
          <svg class="chevron" viewBox="0 0 16 16" aria-hidden="true"><path d="m4 6 4 4 4-4"/></svg>
        </button>
        <div id="device-menu" role="listbox" aria-label="可用设备" hidden></div>
      </div>
      <span id="live"><i class="dot" aria-hidden="true"></i><span id="live-text">连接中</span></span>
    </header>
    <div id="stage">
      <div id="device" data-orientation="portrait" hidden>
        <div id="screen" hidden>
          <video id="video" aria-label="手机实时视频" autoplay muted playsinline hidden></video>
          <img id="image" alt="手机实时屏幕" draggable="false" hidden>
          <svg id="annotation-overlay" aria-label="标注区域" hidden></svg>
          <div id="cursor" class="gesture-cursor" aria-hidden="true" hidden></div>
        </div>
      </div>
      <div id="empty-state" data-state="connecting" role="status" aria-live="polite">
        <div class="empty-state-content">
          <div class="empty-symbol"><svg viewBox="0 0 32 32" aria-hidden="true"><rect x="8.5" y="3.5" width="15" height="25" rx="4"/><path d="M13 6.5h6M14 24.5h4"/></svg></div>
          <span id="empty-state-text">正在连接</span>
          <span class="empty-hint">保持手机已连接并解锁</span>
        </div>
      </div>
    </div>
    <section id="annotation-editor" aria-label="截图标注" hidden>
      <div class="annotation-heading"><span id="annotation-count">拖动框选要讨论的区域</span><button id="annotation-undo" type="button">撤销</button></div>
      <textarea id="annotation-note" aria-label="标注说明" placeholder="说明你希望 Codex 查看或操作什么" rows="2" maxlength="2000"></textarea>
      <div class="annotation-footer"><span id="annotation-hint">画面已冻结</span><button id="annotation-cancel" type="button">返回实时画面</button><button id="annotation-send" type="button">发送给 Codex</button></div>
    </section>
    <div id="toast" role="status" aria-live="polite" hidden></div>
    <nav id="toolbar" aria-label="手机工具">
      <button id="control-button" type="button" aria-label="操作手机" aria-pressed="false" title="启用点按和拖动操作">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 3 14 10-7 1-3 7Z"/></svg><span id="control-label">操作</span>
      </button>
      <button id="annotate-button" type="button" aria-label="标注截图" aria-pressed="false" title="冻结画面，框选并发送给 Codex">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4H4v5M15 4h5v5M4 15v5h5M20 15v5h-5M8 12h8M12 8v8"/></svg><span>标注</span>
      </button>
      <span class="toolbar-divider" aria-hidden="true"></span>
      <button id="tool-refresh" type="button" aria-label="刷新连接" title="重新连接；认证完成后点击可恢复预览">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.5 8.25A7.5 7.5 0 1 0 19.5 12"/><path d="M18.5 4.25v4h-4"/></svg>
      <span>刷新</span></button>
      <button id="tool-pause" type="button" aria-label="暂停预览" title="暂停预览">
        <svg viewBox="0 0 24 24" aria-hidden="true"><g class="pause-symbol"><path d="M9 6v12M15 6v12"/></g><g class="play-symbol"><path d="m8 5 10 7-10 7Z"/></g></svg>
      <span id="pause-label">暂停</span></button>
      <button id="tool-home" type="button" aria-label="回到主屏幕" title="回到主屏幕">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4.5 10.75 6.3-5.3a1.85 1.85 0 0 1 2.4 0l6.3 5.3"/><path d="M6.5 9.15V18A1.5 1.5 0 0 0 8 19.5h8a1.5 1.5 0 0 0 1.5-1.5V9.15"/><path d="M10 19.5v-5.75h4v5.75"/></svg>
      <span>主屏幕</span></button>
      <button id="tool-screenshot" type="button" aria-label="截图到剪贴板" title="截图到剪贴板">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8.5 6.5 1.2-1.75h4.6l1.2 1.75H18a1.75 1.75 0 0 1 1.75 1.75v9.5A1.75 1.75 0 0 1 18 19.5H6a1.75 1.75 0 0 1-1.75-1.75v-9.5A1.75 1.75 0 0 1 6 6.5Z"/><circle cx="12" cy="12.75" r="3.25"/></svg>
      <span>截图</span></button>
    </nav>
  </main>
